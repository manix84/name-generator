name: Bug report
description: Report something broken in Name Generator.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click Randomise
        3. See the problem
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome, Safari, Firefox, Edge..."
  - type: input
    id: device
    attributes:
      label: Device or OS
      placeholder: "macOS, Windows, iOS, Android..."
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Add screenshots, logs, or anything else useful.
